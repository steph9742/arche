# ─────────────────────────────────────────────────────────────────────────────
# Page de secours de l'arche — port dédié, HTTP simple, joignable PAR IP.
#
# Pourquoi un port à part plutôt que le port 443 du domaine :
#
#   1. Le portail YunoHost refuse l'accès par adresse IP — nginx ne trouve aucun
#      hôte virtuel, tombe sur le bloc par défaut et redirige vers
#      /yunohost/admin. Une arche dont le nom ne résout pas est donc totalement
#      inatteignable, ce qui est exactement le scénario que cette page adresse.
#   2. Reprendre « default_server » au bloc d'administration reviendrait à
#      modifier un fichier que YunoHost RÉGÉNÈRE — y compris pendant la
#      restauration nocturne. Un correctif qui disparaît la nuit où la machine
#      restaure est pire qu'aucun correctif.
#   3. Ce fichier-ci n'est pas un « <domaine>.conf » : YunoHost ne le connaît pas
#      et n'y touche pas.
#
# En HTTP et non en HTTPS, délibérément : le contenu est public, il n'y a ni
# secret ni authentification, et un avertissement de certificat auto-signé sur la
# page de dernier recours serait une faute de conception — certains navigateurs
# gérés refusent purement et simplement de le contourner.
#
# Le contenu est produit par pra_page_secours.py. Rien n'est calculé ici.
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    root /var/www/arche-secours;
    index index.html;

    access_log /var/log/nginx/arche-secours-acces.log;
    error_log  /var/log/nginx/arche-secours-erreurs.log;

    # Aucune exécution, aucun mandataire, aucun chemin fourni par l'appelant :
    # ce serveur ne sait que rendre un fichier statique.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Les manuels hors ligne ──────────────────────────────────────────────
    # Servis comme un VRAI SITE, et non à travers l'interface du dépôt : celle-ci
    # rend les fichiers un par un, si bien que les liens entre pages ne
    # fonctionnent pas. Un miroir dont les liens sont morts ne sert à rien.
    #
    # Sans authentification, délibérément : ce sont des documentations publiques,
    # et le jour où l'on en a besoin, exiger un portail serait absurde.
    location /manuels/ {
        alias /var/www/arche-manuels/;
        index index.html;
        # DU TEXTE DOIT S'AFFICHER, PAS SE TÉLÉCHARGER.
        #
        # Les documentations récupérées par leur source sont en Markdown ou en
        # AsciiDoc. nginx ne connaît pas ces extensions et les sert en
        # « application/octet-stream » : le navigateur propose alors de les
        # enregistrer. En pleine crise, chaque page consultée devient un fichier
        # dans le dossier des téléchargements, à ouvrir à la main dans un
        # éditeur.
        #
        # « default_type » ne s'applique QU'AUX extensions inconnues de
        # mime.types : .md, .adoc et .rst en font partie, tandis que .html, .css
        # et les images gardent leur type. C'est pour cela qu'on ne redéfinit
        # pas un bloc « types » ici — il remplacerait mime.types en entier et
        # casserait la mise en page des miroirs sur la première extension
        # oubliée.
        default_type text/plain;
        charset utf-8;
        charset_types text/plain text/html text/css application/javascript;
        # L'index de répertoire permet de descendre dans un miroir dont la page
        # d'accueil manquerait — cela arrive quand une copie a été interrompue.
        autoindex on;
        autoindex_localtime on;
    }
}
