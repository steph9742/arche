# Les manuels hors ligne, servis AUSSI sous le portail.
#
# La page de secours a deux portes : http://<adresse>:8080/ en clair, et
# https://<nom-du-réplica>/accueil/ à travers le portail. Ses liens sont relatifs,
# donc « manuels/ » désigne /manuels/ dans le premier cas et /accueil/manuels/
# dans le second. Le premier chemin existait, le second rendait 404 — et c'est
# pourtant celui qu'on emprunte quand le nom résout, c'est-à-dire presque
# toujours.
#
# Les manuels vivent dans /var/www/arche-manuels, hors du répertoire de la
# my_webapp : on ne peut pas les y copier sans les dupliquer — 700 Mo. Un alias
# suffit, et laisse un seul exemplaire sur le disque.
#
# Le nom du fichier commence par « zzz- » pour être lu après la configuration
# de la my_webapp : une location de préfixe plus longue l'emporte de toute
# façon, mais l'ordre rend l'intention lisible.
location /accueil/manuels/ {
    alias /var/www/arche-manuels/;
    index index.html;
    autoindex on;
    autoindex_localtime on;

    # Même raison que sur le port 8080 : .md, .adoc et .rst ne sont pas dans
    # mime.types et partiraient en « application/octet-stream », c'est-à-dire
    # en téléchargement. « default_type » ne touche que les extensions
    # inconnues : .html, .css et les images gardent la leur.
    default_type text/plain;
    charset utf-8;
    charset_types text/plain text/html text/css application/javascript;

    # Publiques et sans authentification, délibérément : ce sont des
    # documentations d'éditeurs, et exiger un portail le jour où l'on en a
    # besoin serait absurde. C'est déjà le choix fait sur le port 8080.
    auth_basic off;
}
