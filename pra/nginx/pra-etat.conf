# ÉTAT DE L'ARCHE, EN LECTURE LIBRE — côté PRODUCTION.
#
# Deux informations, sans jeton : l'arche est-elle restaurée, et depuis quand.
# C'est de l'information d'exploitation, faite pour qu'une supervision la lise
# sans identifiant.
#
# Ce qui n'y est PAS, et ne doit jamais y entrer : le verdict détaillé, le nom
# de l'archive, les applications en échec, et bien sûr tout ce qui concerne
# l'arche elle-même. Sans jeton veut dire lisible par quiconque atteint ce
# domaine ; chaque champ publié est un champ qu'on ne pourra plus reprendre.
#
# Le fichier est écrit par pra_recu_verifier.sh. nginx ne fait que le servir :
# aucune exécution, aucun listing, aucune écriture possible par cette voie.
#
# ── SSOWAT NE S'APPLIQUE PAS ICI, ET SEULEMENT ICI ─────────────────────────
# YunoHost 12 branche SSOwat par « access_by_lua_file » dans le bloc server de
# chaque domaine : tous les location en héritent. Sans la levée ci-dessous,
# l'API répond 302 vers /yunohost/sso — elle n'est alors pas publique du tout,
# et seule une vérification après installation le révèle.
#
# On redéfinit le gestionnaire d'accès DANS CES DEUX location seulement : une
# redéfinition remplace l'héritage. La portée est tenue par « location = »,
# correspondance EXACTE : un seul fichier statique de deux champs, rien d'autre
# ne peut passer par là. On n'emploie pas une permission SSOwat « public » :
# elle vivrait dans /etc/ssowat, hors du dépôt, modifiée à la main et invisible
# ici — ce fichier-ci, lui, s'en va avec l'installation.
location = /pra/etat.json {
    access_by_lua_block { return }
    alias /var/www/pra-etat/etat.json;
    default_type application/json;
    # Sans cela, un mandataire ou un navigateur servirait un état vieux de
    # plusieurs heures — sur une page dont l'unique intérêt est la fraîcheur.
    add_header Cache-Control "no-store" always;
    # Le fichier peut manquer avant le premier passage du vérificateur : on rend
    # un 404 franc plutôt qu'une page d'erreur YunoHost qui ressemblerait à une
    # réponse.
    error_page 404 = @pra_etat_absent;
}

# La redirection interne d'error_page repasse par la phase d'accès : sans la
# même redéfinition, ce 404 de secours rendrait lui aussi un 302 vers le SSO.
location @pra_etat_absent {
    access_by_lua_block { return }
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 404 '{"restauree":null,"derniere_restauration":null}';
}
