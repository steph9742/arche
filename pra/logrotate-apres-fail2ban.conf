# /etc/systemd/system/logrotate.service.d/arche-apres-fail2ban.conf
#
# LOGROTATE ATTEND FAIL2BAN AU RÉVEIL.
#
# L'arche dort, donc le minuteur quotidien de logrotate manque son rendez-vous
# chaque jour — et « Persistent=true » le rattrape dès le réveil de 02:00. Or la
# règle de rotation de fail2ban se termine par « fail2ban-client flushlogs », qui
# exige que fail2ban tourne déjà. logrotate part dans la seconde qui suit le
# réveil, fail2ban une minute plus tard : socket absente, logrotate en échec — et la
# restauration, qui juge sur l'état final de la machine, a hérité d'un service
# en échec qui n'avait rien à voir avec elle : verdict « partiel ». Le 14, même
# course gagnée, verdict « succès ». Le défaut avait été relevé le 16/08 comme
# « bénin » sans être corrigé : il ne l'était pas, puisqu'il faussait le verdict.
#
# « After= » et non « Requires= » : on veut l'ORDRE, pas la dépendance. Si
# fail2ban est réellement en panne, logrotate échouera encore — et ce sera cette
# fois un vrai signal, qu'il est juste de voir remonter.
[Unit]
After=fail2ban.service
