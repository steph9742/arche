[project]
name = "arche"
version = "0.1.0"
description = "Réplica de reprise d'activité en modèle « pull » pour un serveur YunoHost : interface de pilotage et de suivi"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Université Marie et Louis Pasteur — cellule cybersécurité" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "bcrypt>=4.1",
    "itsdangerous>=2.1",
    "pydantic-settings>=2.2",
    "authlib>=1.3",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
